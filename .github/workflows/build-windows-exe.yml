name: Build Windows exe

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "PrecisionWorksheetMaker" `
            --add-data "precision_worksheets/assets;precision_worksheets/assets" `
            run.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrecisionWorksheetMaker-windows-exe
          path: dist/PrecisionWorksheetMaker.exe

      - name: Publish release with exe
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="windows-exe-${{ github.run_id }}"
          gh release create "$tag" "dist/PrecisionWorksheetMaker.exe" \
            --title "Windows build $tag" \
            --notes "Automated PyInstaller build of PrecisionWorksheetMaker.exe from commit ${{ github.sha }}." \
            --repo "${{ github.repository }}"
